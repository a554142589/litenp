name: CI

on:
  push:
  pull_request:

jobs:
  # ---- L1/L2: build + C++ unit tests across OS / compiler / build type ----
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,  cxx: g++,      compiler_pkg: g++-11,           build_type: Release }
          - { os: ubuntu-22.04,  cxx: g++,      compiler_pkg: g++-11,           build_type: Debug   }
          - { os: ubuntu-22.04,  cxx: clang++,  compiler_pkg: clang-14,         build_type: Release }
          - { os: ubuntu-22.04,  cxx: clang++,  compiler_pkg: clang-14,         build_type: Debug   }
          - { os: macos-13,      cxx: clang++,  compiler_pkg: "",               build_type: Release }
          - { os: macos-13,      cxx: clang++,  compiler_pkg: "",               build_type: Debug   }
          - { os: windows-2022,  cxx: cl,       compiler_pkg: "",               build_type: Release }
          - { os: windows-2022,  cxx: cl,       compiler_pkg: "",               build_type: Debug   }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler (Ubuntu)
        if: runner.os == 'Linux' && matrix.compiler_pkg != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.compiler_pkg }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        env:
          CXX: ${{ matrix.cxx }}

      - name: Build
        run: cmake --build build -j2

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---- memory safety: ASan + UBSan ----
  sanitizer:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang-14

      - name: Configure ASan UBSan
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug
        env:
          CXX: clang++
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined

      - name: Build ASan UBSan
        run: cmake --build build-sanitize -j2

      - name: Test ASan UBSan
        run: ctest --test-dir build-sanitize --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:verify_asan_link_order=0
          UBSAN_OPTIONS: print_stacktrace=1

  # ---- L3: NumPy behavioral oracle ----
  numpy-oracle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install NumPy
        run: python3 -m pip install --upgrade pip numpy

      - name: Run NumPy Oracle (g++)
        run: python3 tests/test_numpy_oracle.py
        env:
          CXX: g++

  # ---- L3: libtorch behavioral oracle ----
  libtorch-oracle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install PyTorch (CPU)
        run: python3 -m pip install --upgrade pip torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run libtorch Oracle (g++)
        run: python3 tests/test_libtorch_oracle.py
        env:
          CXX: g++

  # ---- optional acceleration builds (OpenMP / CBLAS / native arch) ----
  accel-build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        flags:
          - "-DLITENP_USE_OPENMP=ON"
          - "-DLITENP_USE_CBLAS=ON"
          - "-DLITENP_NATIVE_ARCH=ON"
          - "-DLITENP_USE_OPENMP=ON -DLITENP_USE_CBLAS=ON -DLITENP_NATIVE_ARCH=ON"
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.flags }}
        env:
          CXX: g++

      - name: Build
        run: cmake --build build -j2

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---- benchmark smoke (benchmark target compiles) ----
  benchmark-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure Benchmark Target
        run: cmake -S . -B build-bench -DCMAKE_BUILD_TYPE=Release -DLITENP_BUILD_BENCHMARKS=ON

      - name: Build Benchmark Target
        run: cmake --build build-bench --target litenp_bench -j2

  # ---- install + consume ----
  install-consume:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Package
        run: |
          cmake -S . -B build-install -DCMAKE_BUILD_TYPE=Release
          cmake --build build-install -j2
          cmake --install build-install --prefix "$RUNNER_TEMP/litenp-install"

      - name: Consume Installed Package
        run: |
          mkdir -p "$RUNNER_TEMP/litenp-consume"
          cat > "$RUNNER_TEMP/litenp-consume/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(litenp_consume LANGUAGES CXX)
          find_package(litenp CONFIG REQUIRED)
          add_executable(consume main.cpp)
          target_link_libraries(consume PRIVATE litenp::litenp)
          CMAKE
          cat > "$RUNNER_TEMP/litenp-consume/main.cpp" <<'CPP'
          #include "litenp/litenp.hpp"
          int main() {
              auto a = litenp::Array<float>::from_vector({2, 2}, {1.0f, 2.0f, 3.0f, 4.0f});
              auto b = litenp::ones<float>({2, 2});
              auto c = a + b;
              return c({1, 1}) == 5.0f ? 0 : 1;
          }
          CPP
          cmake -S "$RUNNER_TEMP/litenp-consume" -B "$RUNNER_TEMP/litenp-consume/build" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/litenp-install"
          cmake --build "$RUNNER_TEMP/litenp-consume/build" -j2
          "$RUNNER_TEMP/litenp-consume/build/consume"
